schemaVersion: 1
# Repository modules are deployed to the declared DSH home/plugins/<module>.
localPlugins:
  - id: runtime-tooling-guidance
    module: runtime-tooling-guidance.mjs
    config: {}
defaults:
  # The default conversation model belongs to the UI model picker and is never rendered.
  sessionTitle:
    provider: deepseek-official
    model: deepseek-flash
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 65536
    maxOutputTokens: 64
    timeoutMs: 60000
  compaction:
    auto: true
    thresholdRatio: 0.82
    headroomTokens: 8192
    retainTokens: 12000
    maxTokens: 16384
    compactionRetries: 1
    maxOverflowRetries: 1

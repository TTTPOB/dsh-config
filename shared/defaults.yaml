schemaVersion: 1
# Repository modules are deployed to the declared DSH home/plugins/<module>.
localPlugins:
  - id: runtime-tooling-guidance
    module: runtime-tooling-guidance.mjs
    config: {}
  - id: team-collaboration-notes
    module: team-collaboration-notes.mjs
    config: {}
  - id: stream-loop-guard
    module: stream-loop-guard.mjs
    config: {}
  - id: tool-call-hint
    module: tool-call-hint.mjs
    config: {}
  - id: error-code-rules
    module: error-code-rules.mjs
    config:
      rules:
        - providers: [klaude-openai, klaude-cl]
          match: "^upstream_error:"
          code: SERVER
        # Override the classifier's retryable TRANSPORT result for tool names such as web_fetch,
        # leaving recovery to tool-call-hint.
        - providers: [klaude-cl]
          match: "^tool_protocol_error: Model called an unavailable tool: "
          code: PI_AI_ERROR
defaults:
  quota:
    provider: klaude-cl
  # The default conversation model belongs to the UI model picker and is never rendered.
  sessionTitle:
    provider: deepseek-official
    model: deepseek-flash
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 65536
    maxOutputTokens: 64
    timeoutMs: 60000
  compaction:
    auto: true
    thresholdRatio: 0.82
    headroomTokens: 8192
    retainTokens: 12000
    maxTokens: 16384
    compactionRetries: 1
    maxOverflowRetries: 1

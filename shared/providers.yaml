# Shared pi-ai provider catalog.
# Pure data: no !!js expressions here; credentials are referenced by apiKeyEnv.
# A machine adds a provider, overrides its top-level keys (set) or removes it in
# machine.yaml; a nested value such as models replaces the shared value whole.
# baseURL is machine-owned: each machine supplies it under providers.set (private input).
providers:
  klaude-openai:
    compat:
      supportsStrictMode: true
      supportsToolSearch: true
      # Keep the system prompt as the leading input item: GPT-6.2 backends append
      # top-level instructions after input, so every turn re-bills the whole prompt.
      # Sub2API passthrough accounts no longer inject Codex defaults when it is absent.
    displayName: Klaude OpenAI Gateway
    apiKeyEnv: KLAUDE_OPENAI_API_KEY
    retryPolicy:
      mode: normal
      maxRetries: 5
    api: openai-responses
    models:
      - id: gpt-6.2-astra
        name: GPT-6.2 Astra
        contextWindow: 500000
        maxTokens: 32000
        input:
          - text
          - image
        reasoningEfforts:
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
      - id: gpt-6-luna
        name: GPT-6 Luna
        contextWindow: 272000
        maxTokens: 32000
        input:
          - text
          - image
        reasoningEfforts:
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
      - id: gpt-6.2-sol
        name: GPT-6.2 Sol
        contextWindow: 500000
        maxTokens: 32000
        input:
          - text
          - image
        reasoningEfforts:
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
  klaude-cl:
    apiKeyEnv: KLAUDE_CL_API_KEY
    api: openai-responses
    compat:
      supportsToolSearch: true
    models:
      - id: claude-fable-5-2
        name: Claude Fable 5.2
        contextWindow: 500000
        maxTokens: 32000
        input:
          - text
          - image
        reasoningEfforts:
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
      - id: claude-opus-5-5
        name: Claude Opus 5.5
        contextWindow: 500000
        maxTokens: 32000
        input:
          - text
          - image
        reasoningEfforts:
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
      - id: claude-sonnet-5-5
        name: Claude Sonnet 5.5
        contextWindow: 500000
        maxTokens: 32000
        input:
          - text
          - image
        reasoningEfforts:

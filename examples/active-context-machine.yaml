schemaVersion: 1
deployment:
  home: /path/to/harness-home
features:
  sessionTools: false
  activeContext: true
  promptOverlay: false
acp:
  pressureDefault:
    nudgeAtRatio: 0.70
    resetBelowRatio: 0.65
overrides: {}
providers:
  set:
    klaude-openai:
      baseURL: https://klaude.example.invalid/v1
    klaude-cl:
      baseURL: https://klaude.example.invalid
mcp:
  siyuan:
    url: https://siyuan.example.invalid/mcp
    headersFile: /path/to/credentials/siyuan-headers.json
  academicSource:
    url: https://academic-source.example.invalid/mcp
    apiKeyFile: /path/to/credentials/academic-source-key
subagentModels:
  - provider: deepseek-official
    model: deepseek-flash

homePrivate: |
  - insert: []
webPrivate: |
  - insert: []

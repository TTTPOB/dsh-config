schemaVersion: 1
features:
  sessionTools: false
  activeContext: false
  promptOverlay: false
overrides: {}
providers:
  set:
    klaude-openai:
      baseURL: https://klaude.example.invalid/v1
    klaude-cl:
      baseURL: https://klaude.example.invalid
mcp:
  siyuan:
    url: https://siyuan.example.invalid/mcp
    headersFile: /path/to/credentials/siyuan-headers.json
  academicSource:
    url: https://academic-source.example.invalid/mcp
    apiKeyFile: /path/to/credentials/academic-source-key
subagentModels:
  - provider: deepseek-official
    model: deepseek-flash

homePrivate: |
  - insert:
      - id: mcp-playwright
        name: "@deepseek-ai/dsh-mcp-client"
        config:
          serverName: playwright
          transport: stdio
          command: playwright-mcp
          args: ["--browser", "chromium"]
webPrivate: |
  - insert:
      - id: mcp-ppt
        name: "@deepseek-ai/dsh-mcp-client"
        config:
          serverName: ppt
          transport: streamable-http
          url: http://127.0.0.1:18765/mcp
          failOnStartupError: false

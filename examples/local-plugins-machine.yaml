schemaVersion: 1
features:
  sessionTools: false
  activeContext: false
  promptOverlay: false
overrides: {}
providers:
  set:
    klaude-openai:
      baseURL: https://klaude.example.invalid/v1
    klaude-cl:
      baseURL: https://klaude.example.invalid
mcp:
  siyuan:
    url: https://siyuan.example.invalid/mcp
    headersFile: /path/to/credentials/siyuan-headers.json
  academicSource:
    url: https://academic-source.example.invalid/mcp
    apiKeyFile: /path/to/credentials/academic-source-key
subagentModels:
  - provider: deepseek-official
    model: deepseek-flash

homePrivate: |
  - insert: []
webPrivate: |
  - insert: []
localPlugins:
  - id: provider-prompt
    module: provider-prompt.mjs
    modulePath: /path/to/harness-home/plugins/provider-prompt.mjs
    config:
      rules:
        - providers: [klaude-cl]
          text: >-
            Tool naming: when emitting a tool_use call, use the exact names in the actual tool schema,
            such as mcp__parking__run_code and mcp__parking__context_compress.
            Short names like run_code or context_compress are only logical aliases.
            Do not call bash, read, or other tools directly unless they appear in the schema.
            Inside a run_code program, call tools.bash, tools.read, etc. exactly as written,
            without any MCP prefix.
  - id: ptc-string-guidance
    module: ptc-string-guidance.mjs
    modulePath: /path/to/harness-home/plugins/ptc-string-guidance.mjs
    config: {}
  - id: siyuan-tools
    module: siyuan-tools.mjs
    modulePath: /path/to/harness-home/plugins/siyuan-tools.mjs
    config:
      self:
        baseURL: https://notes-self.example.invalid
        headersFile: /path/to/credentials/self-headers.json
      peer:
        baseURL: https://notes-peer.example.invalid
        headersFile: /path/to/credentials/peer-headers.json
      timeoutMs: 60000
